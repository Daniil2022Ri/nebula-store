services:
  db:
    image: postgres:18-alpine
    container_name: nebula-db
    environment:
      POSTGRES_DB: nebula
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
    # 5432 on the host is probably taken by a local PostgreSQL installation
    ports:
      - "55432:5432"
    volumes:
      - nebula-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: nebula-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEBULA_DB_URL: jdbc:postgresql://db:5432/nebula
      NEBULA_DB_USER: nebula
      NEBULA_DB_PASSWORD: nebula
      NEBULA_ADMIN_TOKEN: dev-admin-token
      NEBULA_SEED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s

volumes:
  nebula-db-data:
