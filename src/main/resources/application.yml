server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always

spring:
  application:
    name: nebula-store

  # The real credentials live in application-local.yml (git-ignored) or in env vars.
  profiles:
    default: local

  datasource:
    url: ${NEBULA_DB_URL:jdbc:postgresql://localhost:5432/nebula}
    username: ${NEBULA_DB_USER:postgres}
    password: ${NEBULA_DB_PASSWORD:postgres}
    hikari:
      pool-name: nebula-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

  jackson:
    default-property-inclusion: non_null

app:
  admin-token: ${NEBULA_ADMIN_TOKEN:dev-admin-token}
  seed-demo-data: ${NEBULA_SEED:true}
  currency: RUB
  cart-ttl-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Nebula Store
    version: 1.0.0
    java: 21

logging:
  level:
    root: INFO
    com.nebula.store: INFO
