server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  error:
    include-message: always

spring:
  application:
    name: nebula-store
  datasource:
    url: jdbc:h2:file:./data/nebula;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
  jackson:
    default-property-inclusion: non_null

app:
  admin-token: ${NEBULA_ADMIN_TOKEN:dev-admin-token}
  seed-demo-data: ${NEBULA_SEED:true}
  currency: RUB
  cart-ttl-minutes: 720

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Nebula Store
    version: 1.0.0
    java: 21

logging:
  level:
    root: INFO
    com.nebula.store: INFO
